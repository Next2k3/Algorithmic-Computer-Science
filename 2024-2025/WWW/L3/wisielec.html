            <div class="keyboard" id="keyboard"></div>
            <div class="message win" id="winMessage">Gratulacje! Wygrałeś</div>
            <div class="message lose" id="loseMessage">
                Przegrałeś! Hasło to: <span id="correctWord"></span>
            </div>
            <div class="endbuttons">
                <button id="newGameBtn">Nowa Gra</button>
                <button id="cancelGameBtn">Anuluj Grę</button>
            </div>
